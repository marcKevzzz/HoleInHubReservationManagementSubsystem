services:
  mongodb:
    image: mongo:7.0
    container_name: holeinhub-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --eval '
          try {
            rs.status();
            if (!db.hello().isWritablePrimary) { quit(1); }
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            });
            quit(1);
          }
        ' || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongo-data:
