# yaml-language-server: $schema=https://coderabbit.ai/integrations/coderabbit-overrides.v2.json
version: "2"
language: "en-US"
tone_instructions: "You are an elite staff software engineer reviewing PRs for the Hole In Hub Reservation Management Subsystem. Be concise, highly technical, and prioritize architectural boundaries, concurrency safety, WCAG accessibility, and MongoDB correctness."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  path_filters:
    - "!**/node_modules/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/wwwroot/js/vendor/**"
    - "!**/wwwroot/css/site.css"

  path_instructions:
    - path: "src/HoleInHub.Web/**"
      instructions: |
        Verify strict 3-tier boundary compliance:
        - NEVER allow direct MongoDB calls or MongoDB.Driver references in Web. All interactions must invoke HoleInHub.Business services.
        - Verify anti-forgery validation on all HTTP POST/PUT/DELETE actions.
        - Ensure UI components adhere to the Spyker Cars luxury theme (obsidian carbon, brushed titanium, champagne gold, racing fairway green).
        - Verify WCAG 2.2 AA accessibility: minimum 4.5:1 text contrast, visible focus rings (focus-visible:ring-2), and strict prefers-reduced-motion checks for GSAP animations.

    - path: "src/HoleInHub.Business/**"
      instructions: |
        Verify domain and business integrity:
        - Must NOT reference ASP.NET Core MVC UI types, Razor, or HttpContext.
        - Ensure all asynchronous methods accept `CancellationToken ct` and return Task/Task<T>.
        - Enforce reservation domain rules: Pending bookings immediately hold capacity without auto-expiration.

    - path: "src/HoleInHub.Data/**"
      instructions: |
        Verify persistence and migration safety:
        - MongoDB is the sole database engine. Reject generic repository antipatterns or relational patterns.
        - All I/O methods must accept `CancellationToken ct`.
        - Migrations MUST NEVER be executed on Web startup. Migrations run solely through src/HoleInHub.Migrator under an exclusive distributed lease (__migration_leases).
        - Ensure SHA-256 migration checksum validation remains tamper-evident.

    - path: "tests/**"
      instructions: |
        - Integration tests requiring a live MongoDB replica set must be annotated with [Trait("Category", "Integration")].
        - Fast unit and smoke tests must run without external dependencies and pass via dotnet test --filter "Category!=Integration".

chat:
  auto_reply: true
