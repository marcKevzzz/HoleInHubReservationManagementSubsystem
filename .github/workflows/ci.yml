name: Continuous Integration

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Format Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'HoleInHub.Web/package-lock.json'

    - name: Install NPM Dependencies & Build Assets
      working-directory: HoleInHub.Web
      run: |
        npm ci
        npm run build

    - name: Verify Code Formatting
      run: dotnet format HoleInHubReservationManagementSubsystem.slnx --verify-no-changes

    - name: Restore .NET Dependencies
      run: dotnet restore HoleInHubReservationManagementSubsystem.slnx

    - name: Build Solution (Release)
      run: dotnet build HoleInHubReservationManagementSubsystem.slnx --configuration Release --no-restore

    - name: Run Unit & Web Smoke Tests
      run: dotnet test HoleInHubReservationManagementSubsystem.slnx --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=test-results.trx"

    - name: Publish Web Application
      run: dotnet publish HoleInHub.Web/HoleInHub.Web.csproj --configuration Release --no-build --output ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: holeinhub-web-drop
        path: ./publish
        retention-days: 7

  integration-tests:
    name: MongoDB Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'HoleInHub.Web/package-lock.json'

    - name: Build Assets
      working-directory: HoleInHub.Web
      run: |
        npm ci
        npm run build

    - name: Start MongoDB Replica Set
      run: |
        docker compose -f docker-compose.mongo.yml up -d --wait --wait-timeout 120
        docker compose -f docker-compose.mongo.yml exec -T mongodb mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1); }'

    - name: Restore Dependencies
      run: dotnet restore HoleInHubReservationManagementSubsystem.slnx

    - name: Run MongoDB Integration Tests
      env:
        MongoDb__ConnectionString: "mongodb://localhost:27017/?replicaSet=rs0"
      run: dotnet test HoleInHubReservationManagementSubsystem.slnx --filter "Category=Integration" --logger "trx;LogFileName=integration-results.trx"

    - name: MongoDB Logs on Failure
      if: failure()
      run: docker compose -f docker-compose.mongo.yml logs

    - name: Stop MongoDB
      if: always()
      run: docker compose -f docker-compose.mongo.yml down --volumes
